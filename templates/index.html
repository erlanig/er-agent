<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ER Agent — Asisten AI Riset, Data & Engineering</title>
<link rel="icon" type="image/x-icon" href="/bird.ico">
<link rel="icon" type="image/png" href="/bird.png">
<link rel="apple-touch-icon" href="/bird.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link id="hl-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/styles/github.min.css">
<link id="hl-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/styles/github-dark.min.css" disabled>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style nonce="{{ csp_nonce }}">
:root{
  --bg:#fbfbfa; --side:#f5f5f3; --surface:#ffffff; --hover:#eaeae7; --ink:#1a1c1e; --muted:#646a70;
  --line:#e4e6e8; --accent:#186a58; --accent-2:#104e40; --accent-ink:#ffffff; --accent-soft:#e5f2ee;
  --user:#f0f7f5; --code:#f4f5f6;
  --ok:#15803d; --warn:#b45309; --warn-soft:#fef3c7; --err:#b91c1c;
  --shadow:0 2px 10px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.02);
  --shadow-lg:0 12px 30px -4px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.03);
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs-base:15px;
  --max-w:820px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111417; --side:#171b1f; --surface:#1f2429; --hover:#2a3038; --ink:#edf0f2; --muted:#959da5;
  --line:#282f37; --accent:#34a087; --accent-2:#24806b; --accent-ink:#0a1714; --accent-soft:#18332d;
  --user:#193029; --code:#171b20;
  --ok:#34d399; --warn:#fbbf24; --warn-soft:#3d2d0a; --err:#f87171;
  --shadow:0 4px 16px rgba(0,0,0,.4),0 1px 4px rgba(0,0,0,.2);
  --shadow-lg:0 16px 36px -4px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#111417; --side:#171b1f; --surface:#1f2429; --hover:#2a3038; --ink:#edf0f2; --muted:#959da5;
    --line:#282f37; --accent:#34a087; --accent-2:#24806b; --accent-ink:#0a1714; --accent-soft:#18332d;
    --user:#193029; --code:#171b20;
    --ok:#34d399; --warn:#fbbf24; --warn-soft:#3d2d0a; --err:#f87171;
    --shadow:0 4px 16px rgba(0,0,0,.4),0 1px 4px rgba(0,0,0,.2);
    --shadow-lg:0 16px 36px -4px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
@supports (height:100dvh){html,body{height:100dvh}}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:var(--fs-base);line-height:1.65;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico-btn{display:grid;place-items:center;width:34px;height:34px;border:0;background:none;border-radius:9px;color:var(--muted);transition:all .15s}
.ico-btn:hover{background:var(--hover);color:var(--ink)}

/* App Layout & Smooth Collapsible Sidebar */
.app{display:flex;height:100%;overflow:hidden;width:100%}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  width:280px;flex:none;overflow:hidden;transition:width .22s cubic-bezier(.2,.8,.2,1);z-index:20;position:relative}
.app.collapsed .side{width:56px}

.brand{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px;height:54px;border-bottom:1px solid transparent}
.brand-left{display:flex;align-items:center;gap:10px;overflow:hidden}
.brand-text{font-weight:700;font-size:16px;letter-spacing:-.015em;white-space:nowrap;color:var(--ink);transition:opacity .15s}
.app.collapsed .brand-left{display:none}
.app.collapsed .brand{justify-content:center;padding:10px 0}
.app.collapsed .side-top-inner{opacity:0;pointer-events:none;display:none}
.app.collapsed .rail-icons{display:flex}

.rail-icons{display:none;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.rail-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--muted);transition:all .15s}
.rail-btn:hover{color:var(--ink);border-color:var(--accent);background:var(--accent-soft)}

.side-top{padding:8px 10px;display:grid;gap:8px}
.btn-new{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);background:var(--surface);
  border-radius:11px;font-weight:600;font-size:13.5px;box-shadow:0 1px 2px rgba(0,0,0,.02);transition:all .15s;white-space:nowrap}
.btn-new:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;padding:7px 0;font-size:13px;color:var(--ink)}

.list{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 8px 12px}
.app.collapsed .list{display:none}

.sec{display:flex;align-items:center;justify-content:space-between;padding:12px 6px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sec button{border:0;background:none;color:var(--muted);padding:2px 4px;border-radius:6px;display:grid}
.sec button:hover{color:var(--ink);background:var(--hover)}
.hint-s{padding:4px 8px 6px;font-size:12px;color:var(--muted)}
.item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;color:var(--muted);position:relative;transition:background .12s;font-size:13.5px}
.item.indent{margin-left:14px}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover{background:var(--hover);color:var(--ink)}
.item.active{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.04),inset 0 0 0 1px var(--line)}
.item .acts{display:none;gap:2px}
.item:hover .acts,.item:focus-within .acts{display:flex}
.item .acts button{border:0;background:none;color:var(--muted);padding:3px;border-radius:6px;display:grid}
.item .acts button:hover{color:var(--ink);background:var(--bg)}
.item .pin-mark{color:var(--accent)}
.item .cnt{font-size:11px;opacity:.7;font-weight:600}
.item:hover .cnt{display:none}

.side-foot{padding:8px 10px;border-top:1px solid var(--line);display:flex;gap:4px;align-items:center}
.side-foot .grow{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;padding:7px 9px;border-radius:9px;color:var(--muted);text-align:left;font-size:13.5px;font-weight:500;white-space:nowrap}
.side-foot .grow:hover{background:var(--hover);color:var(--ink)}
.app.collapsed .side-foot .grow span{display:none}

/* Main Workspace */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1;position:relative;overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface);min-height:54px}
.model-badge{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;max-width:30vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.spacer{flex:1}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.col{max-width:var(--max-w);margin:0 auto;padding:12px 20px 32px}

/* Empty State / Welcome Screen */
.empty{max-width:680px;margin:min(10vh,80px) auto 0;padding:0 16px;text-align:center;animation:fadeIn .3s ease}
.empty-logo{width:54px;height:54px;object-fit:contain;margin:0 auto 16px;border-radius:12px}
.empty h1{font-size:26px;font-weight:800;letter-spacing:-.025em;margin:0 0 8px;color:var(--ink)}
.empty p{color:var(--muted);margin:0 0 28px;font-size:14.5px;line-height:1.55}

.starters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left}
@media (max-width:640px){.starters{grid-template-columns:1fr}}
.starter-card{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.starter-card:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.starter-card b{font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:6px}
.starter-card span{font-size:12px;color:var(--muted);line-height:1.4}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Messages */
.msg{margin:20px 0;display:flex;gap:12px}
.msg.user{justify-content:flex-end}
.msg.user .user-wrap{max-width:85%;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.msg.user .body{background:var(--user);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);color:var(--ink);padding:10px 14px;border-radius:16px 16px 4px 16px;word-break:break-word;line-height:1.6}
.msg.user .body p{margin:.4em 0}
.msg.user .body p:first-child{margin-top:0}
.msg.user .body p:last-child{margin-bottom:0}
.mobile-only{display:none}
@media (max-width:820px){.mobile-only{display:grid}}

.msg.bot{justify-content:flex-start}
.bot-main{flex:1;min-width:0}
.body{word-break:break-word;overflow-wrap:anywhere}
.body>:first-child{margin-top:0}.body>:last-child{margin-bottom:0}
.body p{margin:.6em 0}
.body a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.body h1,.body h2,.body h3,.body h4{line-height:1.3;margin:1.1em 0 .4em;letter-spacing:-.01em;font-weight:700}
.body h1{font-size:1.35em}.body h2{font-size:1.2em}.body h3{font-size:1.06em}
.body ul,.body ol{padding-left:1.4em;margin:.5em 0}
.body li{margin:.2em 0}
.body hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.body blockquote{margin:.7em 0;padding:2px 0 2px 12px;border-left:3px solid var(--accent);color:var(--muted);background:var(--code);border-radius:0 8px 8px 0}
.body :not(pre)>code{font-family:var(--mono);font-size:.87em;background:var(--code);border:1px solid var(--line);padding:.1em .36em;border-radius:5px}

/* Live Status Line & Reasoning */
.live-status{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:500;margin-bottom:8px}
.live-pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

.reasoning-box{border:1px solid var(--line);border-radius:10px;background:var(--code);margin:8px 0;font-size:12.5px;color:var(--muted);overflow:hidden}
.reasoning-box summary{padding:7px 11px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px}
.reasoning-box .r-content{padding:8px 12px;border-top:1px solid var(--line);white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.55;max-height:260px;overflow:auto}

/* Code Blocks & Tables */
.code{margin:.85em 0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--code)}
.code-h{display:flex;align-items:center;justify-content:space-between;padding:5px 10px 5px 12px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.code-h button{display:flex;align-items:center;gap:5px;border:0;background:none;color:var(--muted);padding:3px 7px;border-radius:6px;font-family:var(--sans);font-size:11.5px}
.code-h button:hover{background:var(--hover);color:var(--ink)}
.code pre{margin:0;padding:12px;overflow:auto}
.code pre code{font-family:var(--mono);font-size:12.5px;line-height:1.6;background:none!important;padding:0!important;border:0}
.hljs{background:transparent!important}

/* Tidy Tables with Copy & Font Formatting */
.tbl-wrap{position:relative;margin:1em 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tbl-bar{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--code);font-size:11.5px;color:var(--muted)}
.tbl-bar-title{font-weight:600;font-family:var(--mono)}
.tbl-actions{display:flex;gap:4px}
.tbl-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600}
.tbl-btn:hover{background:var(--hover);color:var(--ink)}
.tbl-scroll{overflow-x:auto}
.tbl-wrap table{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl-wrap th,.tbl-wrap td{padding:7px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl-wrap th{background:var(--code);font-weight:600;white-space:nowrap}
.tbl-wrap tr:last-child td{border-bottom:0}
.tbl-wrap tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--code) 40%,transparent)}

/* Tool execution items */
.tool{border:1px solid var(--line);background:var(--surface);border-radius:10px;margin:6px 0;font-size:12.5px;overflow:hidden}
.tool summary{cursor:pointer;padding:7px 10px;display:flex;align-items:center;gap:7px;list-style:none;color:var(--muted)}
.tool summary::-webkit-details-marker{display:none}
.tool .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.tool.running .dot{background:var(--accent);animation:pulse 1s infinite}
.tool.done .dot{background:var(--ok)}
.tool.fail .dot{background:var(--err)}
.tool.wait .dot{background:var(--warn)}
.tool .name{font-family:var(--mono);font-weight:600;color:var(--ink)}
.tool pre{margin:0;padding:8px 10px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;
  white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;color:var(--muted)}
.err{margin-top:8px;padding:9px 11px;border:1px solid var(--err);border-radius:10px;color:var(--err);font-size:13px;white-space:pre-wrap;background:color-mix(in srgb,var(--err) 8%,transparent)}

.acts-row{display:flex;align-items:center;gap:5px;margin-top:6px;opacity:.7}
.msg:hover .acts-row,.acts-row:focus-within{opacity:1}
.acts-row button{display:flex;align-items:center;gap:5px;border:0;background:none;color:var(--muted);padding:3px 7px;border-radius:6px;font-size:12px}
.acts-row button:hover{background:var(--hover);color:var(--ink)}
.acts-row .meta-dur{font-size:11.5px;color:var(--muted);margin-left:auto;font-family:var(--mono)}

/* Approvals */
.appr{border:1px solid var(--warn);background:var(--surface);border-radius:12px;margin:8px 0;overflow:hidden;font-size:13px}
.appr.done{border-color:var(--ok)}.appr.fail,.appr.rejected,.appr.expired{border-color:var(--err)}
.appr-h{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--warn-soft)}
.appr-h b{font-family:var(--mono);font-weight:600}
.appr-kv{display:grid;grid-template-columns:100px 1fr;gap:4px 8px;padding:8px 11px;border-top:1px solid var(--line);max-height:280px;overflow:auto}
.appr-kv span:nth-child(odd){color:var(--muted)}
.appr-kv span:nth-child(even){white-space:pre-wrap;word-break:break-word}
.appr-b{display:flex;gap:7px;justify-content:flex-end;padding:7px 11px;border-top:1px solid var(--line)}
.appr-s{padding:7px 11px;border-top:1px solid var(--line);color:var(--muted);word-break:break-word}
.appr-s a{color:var(--accent);font-weight:600}

/* Composer & Tools Picker */
.composer{flex:none;padding:6px 18px 16px}
.comp-wrap{max-width:var(--max-w);margin:0 auto;display:flex;flex-direction:column;gap:6px}

.dyn-prompts{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.dyn-prompts::-webkit-scrollbar{display:none}
.dyn-prompts:empty{display:none}
.dyn-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap;box-shadow:var(--shadow);transition:all .15s}
.dyn-chip:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);transform:translateY(-1px)}

.box{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 12px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--accent);box-shadow:var(--shadow-lg)}
.att-tray{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.att-tray:empty{display:none}
.att-card{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:12px;position:relative}
.att-card img.thumb{width:28px;height:28px;object-fit:cover;border-radius:6px}
.att-card .meta{display:flex;flex-direction:column;line-height:1.2;max-width:150px}
.att-card .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-card .sub{font-size:10.5px;color:var(--muted)}
.att-card .rm{border:0;background:var(--hover);color:var(--muted);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;padding:0;margin-left:3px}
.att-card .rm:hover{background:var(--err);color:#fff}

.box textarea{width:100%;border:0;outline:0;background:none;resize:none;max-height:220px;padding:4px 0;line-height:1.5;font-size:14.5px}
.box-foot{display:flex;align-items:center;gap:8px;padding-top:4px;border-top:1px solid transparent}
.model-picker{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px;font-size:12.5px;font-weight:600;color:var(--ink);outline:0}
.deep-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.deep-toggle.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.send{width:34px;height:34px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;transition:transform .15s,opacity .15s}
.send:hover:not(:disabled){transform:scale(1.05)}
.send:disabled{opacity:.3;cursor:default}

.hint{max-width:var(--max-w);margin:3px auto 0;text-align:center;font-size:11.5px;color:var(--muted)}

/* Dropzone */
.dropzone{position:fixed;inset:0;background:rgba(24,106,88,.15);backdrop-filter:blur(3px);z-index:50;display:none;place-items:center;padding:20px}
.dropzone.show{display:grid}
.drop-card{background:var(--surface);border:2px dashed var(--accent);border-radius:20px;padding:32px 40px;text-align:center;box-shadow:var(--shadow-lg)}
.drop-card h3{margin:0 0 4px;font-size:17px}
.drop-card p{margin:0;color:var(--muted);font-size:13px}

/* Modal Dialogs */

function ico(name, size = 16){
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size); s.setAttribute('height', size);
  s.setAttribute('fill', name === 'more' ? 'currentColor' : 'none'); s.setAttribute('stroke', name === 'more' || name === 'stop' ? 'none' : 'currentColor');
  s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
  s.setAttribute('aria-hidden', 'true'); s.innerHTML = ICONS[name] || ICONS['book']; return s;
}

function iconBtn(name, title, onClick, size = 15){

  b.onclick = e => { e.stopPropagation(); onClick(e, b); }; return b;
}

function formatBytes(b){
  if(b < 1024) return b + ' B';
  if(b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}
const fmtMs = ms => ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(1) + ' dtk';

/* ------------------------------ API Wrapper (CSRF & Security) ------------------------------ */
async function api(url, opts = {}){
  const headers = Object.assign({}, opts.headers || {});
  const method = (opts.method || 'GET').toUpperCase();
  if(['POST', 'PUT', 'DELETE', 'PATCH'].includes(method)){
    headers['X-Requested-With'] = 'er-agent';
    if(opts.body && typeof opts.body === 'string' && !headers['Content-Type']){
      headers['Content-Type'] = 'application/json';
    }
  }
  const res = await fetch(url, {...opts, headers});
  if(res.status === 401 && !url.includes('/api/session')){
    showGate('Sesi berakhir. Masuk kembali.');
  }
  return res;
}

/* ------------------------------ State ------------------------------ */
const DEFAULTS = {
  theme: 'auto',
  fontSize: 'medium',
  chatWidth: 'normal',
  style: 'seimbang',
  language: 'auto',
  about: '',
  instructions: '',
  enterToSend: true,
  defaultDeep: false,
  copyFont: 'auto',
  disabledTools: [],
  sidebarCollapsed: false
};

const state = {
  chats: store.get('bc.chats', []),
  projects: store.get('bc.projects', []),
  activeId: store.get('bc.active', null),
  settings: Object.assign({}, DEFAULTS, store.get('bc.settings', {})),
  config: {models: [], tools: [], limits: {upload_mb: 25, dataset_mb: 8}},
  query: '',
  attachments: [],
  datasets: [],
  deep: false
};

let busy = false, controller = null, raf = 0, liveEl = null, liveMsg = null;
const active = () => state.chats.find(c => c.id === state.activeId);
const project = id => state.projects.find(p => p.id === id);

function save(){
  store.set('bc.chats', state.chats.slice(0, 150));
  store.set('bc.projects', state.projects);
  store.set('bc.active', state.activeId);
  store.set('bc.settings', state.settings);
  scheduleSync();
}

/* ------------------------------ Database Sync (Postgres) ------------------------------ */
const sync = {on: false, pushed: {}, proj: '', timer: 0, busy: false, again: false};
function slimChat(c){
  return {...c, messages: (c.messages||[]).map(m => {
    const {images, ...r} = m;
    if(r.files) r.files = r.files.map(f => ({name: f.name, size: f.size, kind: f.kind}));
    return r;
  })};
}

async function pullSync(){
  if(!state.config.features?.sync) return false;
  try{
    const r = await api('/api/sync');
    if(!r.ok) return false;
    const j = await r.json(), last = store.get('bc.lastSync', 0);
    const local = new Map(state.chats.map(c => [c.id, c])), merged = [];
    sync.pushed = {};
    for(const sc of j.chats){
      const lc = local.get(sc.id); local.delete(sc.id);
      sync.pushed[sc.id] = JSON.stringify(slimChat(sc));
      merged.push(lc && (lc.updated || 0) > (sc.updated || 0) ? lc : sc);
    }
    for(const lc of local.values()) if((lc.updated || 0) > last) merged.push(lc);
    state.chats = merged;
    if(j.projects && j.projects.length) state.projects = j.projects;
    sync.proj = JSON.stringify(j.projects);
    if(!state.chats.some(c => c.id === state.activeId)) state.activeId = state.chats[0]?.id || null;
    store.set('bc.lastSync', Date.now());
    sync.on = true; save();
    return true;
  }catch{ return false; }
}

function scheduleSync(){
  if(!sync.on) return;
  clearTimeout(sync.timer); sync.timer = setTimeout(pushSync, 1500);
}

async function pushSync(){
  if(!sync.on) return;
  if(sync.busy){ sync.again = true; return; }
  sync.busy = true;
  try{
    const ids = new Set(state.chats.map(c => c.id));
    for(const id of Object.keys(sync.pushed)){
      if(ids.has(id)) continue;
      const r = await api('/api/chats/' + id, {method: 'DELETE'});
      if(r.ok) delete sync.pushed[id];
    }
    for(const c of state.chats){
      if(!c.messages.length || (busy && c.id === state.activeId)) continue;
      const body = JSON.stringify(slimChat(c));
      if(sync.pushed[c.id] === body) continue;
      const r = await api('/api/chats/' + c.id, {method: 'PUT', body});
      if(r.ok) sync.pushed[c.id] = body;
    }
    const pj = JSON.stringify(state.projects);
    if(pj !== sync.proj){
      const r = await api('/api/projects', {method: 'PUT', body: pj});
      if(r.ok) sync.proj = pj;
    }
    store.set('bc.lastSync', Date.now());
  }catch{}
  finally{ sync.busy = false; if(sync.again){ sync.again = false; scheduleSync(); } }
}

/* ---------------------------- Markdown & Math ---------------------------- */
function extractMath(t, bag){
  const put = (tex, display) => {
    if(!window.katex) return display ? `$$${tex}$$` : `$${tex}$`;
    let out; try{ out = katex.renderToString(tex, {displayMode: display, throwOnError: false}); }catch{ out = escapeHtml(tex); }
    bag.push(out); return `%%MATH${bag.length - 1}%%`;
  };
  t = t.replace(/\$\$([\s\S]+?)\$\$/g, (_, x) => put(x.trim(), true));
  t = t.replace(/\\\[([\s\S]+?)\\\]/g, (_, x) => put(x.trim(), true));
  t = t.replace(/\\\(([\s\S]+?)\\\)/g, (_, x) => put(x.trim(), false));
  t = t.replace(/(?<![\\$\w])\$(?!\s)([^\n$]+?)(?<!\s)\$(?![\d\w])/g, (_, x) => put(x, false));
  return t;
}

function renderMarkdown(src){
  const bag = [];
  const parts = src.split(/(```[\s\S]*?(?:```|$)|`[^`\n]*`)/g);
  const prepared = parts.map((p, i) => i % 2 ? p : extractMath(p, bag)).join('');
  let html = DOMPurify.sanitize(marked.parse(prepared, {gfm: true, breaks: true}));
  return html.replace(/%%MATH(\d+)%%/g, (_, i) => bag[+i] ?? '');
}

/* ---------------------- Tabel Format & Salin Rapi (Aptos / Times New Roman) ---------------------- */
async function resolveCopyFont(){
  const pref = state.settings.copyFont || state.config.copy?.font_default || 'auto';
  if(pref !== 'auto') return pref;
  try{
    if(document.fonts && document.fonts.check){
      if(document.fonts.check('12px "Plus Jakarta Sans"')) return 'Plus Jakarta Sans';
      if(document.fonts.check('12px "Aptos"')) return 'Aptos';
    }
  }catch{}
  return 'Times New Roman';
}

async function copyTableFormatted(tableEl, btn){
  const font = await resolveCopyFont();
  const clone = tableEl.cloneNode(true);
  
  clone.setAttribute('style', `border-collapse:collapse;width:100%;font-family:"${font}",Aptos,"Times New Roman",serif;font-size:11pt;color:#111827;margin:8pt 0;`);
  clone.querySelectorAll('th').forEach(th => {
    th.setAttribute('style', `border:1px solid #94a3b8;background-color:#e2e8f0;color:#0f172a;font-weight:bold;padding:6pt 10pt;text-align:left;vertical-align:top;font-family:"${font}",Aptos,"Times New Roman",serif;`);
  });
  clone.querySelectorAll('td').forEach(td => {
    td.setAttribute('style', `border:1px solid #cbd5e1;padding:5pt 10pt;vertical-align:top;font-family:"${font}",Aptos,"Times New Roman",serif;`);
  });

  // Buat versi teks TSV murni untuk Excel/Sheets
  const rows = [];
  tableEl.querySelectorAll('tr').forEach(tr => {
    const cells = [];
    tr.querySelectorAll('th,td').forEach(c => cells.push(c.textContent.trim().replace(/\t/g, ' ')));
    rows.push(cells.join('\t'));
  });
  const tsvText = rows.join('\n');

  const wrapper = `<div style="font-family:'${font}',Aptos,'Times New Roman',serif;font-size:11pt;line-height:1.4">${clone.outerHTML}</div>`;
  const oldText = btn.innerHTML;
  
  try{
    if(window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([wrapper], {type: 'text/html'}),
        'text/plain': new Blob([tsvText], {type: 'text/plain'})
      })]);
    } else {
      await navigator.clipboard.writeText(tsvText);
    }
    btn.innerHTML = '<span>Tersalin! (' + font + ')</span>';
    setTimeout(() => { btn.innerHTML = oldText; }, 1500);
  }catch(e){
    navigator.clipboard.writeText(tsvText);
  }
}

function downloadTableCSV(tableEl, filename = 'tabel.csv'){
  const rows = [];
  tableEl.querySelectorAll('tr').forEach(tr => {
    const cells = [];
    tr.querySelectorAll('th,td').forEach(c => {
      let t = c.textContent.trim().replace(/"/g, '""');
      cells.push(`"${t}"`);
    });
    rows.push(cells.join(','));
  });
  const blob = new Blob([rows.join('\n')], {type: 'text/csv;charset=utf-8;'});
  const u = URL.createObjectURL(blob);
  const a = el('a'); a.href = u; a.download = filename; a.click();
  URL.revokeObjectURL(u);
}

function enhance(root, live){
  // Bungkus tabel dengan Toolbar Aksi (Salin Tabel Rapi / CSV)
  root.querySelectorAll('table').forEach(tbl => {
    if(tbl.parentElement.classList.contains('tbl-scroll')) return;
    const wrap = el('div', 'tbl-wrap');
    const bar = el('div', 'tbl-bar');
    bar.append(el('span', 'tbl-bar-title', 'Tabel Data'));
    
    const actions = el('div', 'tbl-actions');
    const cpBtn = el('button', 'tbl-btn', 'Salin Tabel');
    cpBtn.type = 'button';
    cpBtn.prepend(ico('copy', 12));
    cpBtn.onclick = () => copyTableFormatted(tbl, cpBtn);

    const csvBtn = el('button', 'tbl-btn', 'CSV');
    csvBtn.type = 'button';
    csvBtn.prepend(ico('table', 12));
    csvBtn.onclick = () => downloadTableCSV(tbl);

    actions.append(cpBtn, csvBtn);
    bar.append(actions);

    const scrollBox = el('div', 'tbl-scroll');
    tbl.replaceWith(wrap);
    scrollBox.append(tbl);
    wrap.append(bar, scrollBox);

  // Blok Kode
  root.querySelectorAll('pre').forEach(pre => {

    const code = pre.querySelector('code'); if(!code) return;
    const lang = (code.className.match(/language-([\w+-]+)/) || [])[1] || 'teks';
    
    if(lang === 'mermaid' && !live && window.mermaid){
      renderMermaid(pre, code.textContent);
      return;
    }
    if(window.hljs && !live){ try{ hljs.highlightElement(code); }catch{} }
    
    const box = el('div', 'code'), head = el('div', 'code-h');
    head.append(el('span', '', lang));
    const b = el('button'); b.type = 'button'; b.append(ico('copy', 13), document.createTextNode('Salin'));
    b.onclick = () => copyText(code.textContent, b);
    head.append(b); pre.replaceWith(box); box.append(head, pre);
  });

  root.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
}

function renderMermaid(pre, src){
  const box = el('div', 'mermaid-box'), head = el('div', 'code-h'), view = el('div', 'mm-view');

async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); }catch{ return; }
  if(!btn) return; const old = [...btn.childNodes];
  btn.replaceChildren(ico('check', 13), document.createTextNode('Tersalin'));
  setTimeout(() => btn.replaceChildren(...old), 1300);
}

/* ---------------------- File & Dataset Handling ---------------------- */
async function handleFiles(fileList){
  const uploadLimitMb = state.config.limits?.upload_mb || 25;
  for(const file of Array.from(fileList)){
    if(file.size > uploadLimitMb * 1024 * 1024){
      alert(`Ukuran berkas "${file.name}" melampaui batas maksimal (${uploadLimitMb}MB).`);
      continue;
    }
    const id = uid();
    const isImg = file.type.startsWith('image/');
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const isDocOrData = ['pdf', 'docx', 'xlsx', 'csv', 'tsv'].includes(ext);

    const item = {id, name: file.name, size: file.size, kind: isImg ? 'image' : isDocOrData ? 'dataset' : 'text', mediaType: file.type || 'text/plain', loading: true};
    state.attachments.push(item);
    renderAttachments();

    try{
      if(isImg){
        const dataUrl = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = rej;
          r.readAsDataURL(file);
        });
        item.dataUrl = dataUrl;
      } else if(isDocOrData){
        const fd = new FormData();
        fd.append('file', file);
        const r = await api('/api/extract', {method: 'POST', body: fd});
        const j = await r.json();
        if(!r.ok) throw new Error(j.error || 'Gagal mengekstrak dokumen.');
        item.textContent = j.text;
        if(j.datasets && j.datasets.length){
          state.datasets.push(...j.datasets);
        }
      } else {
        item.textContent = await file.text();
      }
      item.loading = false;
    }catch(err){
      state.attachments = state.attachments.filter(x => x.id !== id);
      alert(`Gagal memuat "${file.name}": ${err.message}`);
    }
    renderAttachments();
    updateDynamicPrompts();
    autosize();
  }
}

function renderAttachments(){
  const tray = $('#attTray');
  tray.replaceChildren();
  for(const a of state.attachments){
    const card = el('div', 'att-card');
    if(a.kind === 'image' && a.dataUrl){
      const img = el('img', 'thumb'); img.src = a.dataUrl; img.alt = a.name; card.append(img);
    } else {
      const icoF = ico(a.kind === 'dataset' ? 'table' : 'book', 16);
      card.append(icoF);
    }
    const meta = el('div', 'meta');
    meta.append(el('span', 'name', a.name), el('span', 'sub', a.loading ? 'Memproses…' : formatBytes(a.size)));
    const rm = el('button', 'rm'); rm.type = 'button'; rm.title = 'Hapus'; rm.append(ico('x', 11));
    rm.onclick = () => {
      state.attachments = state.attachments.filter(x => x.id !== a.id);
      renderAttachments();
      updateDynamicPrompts();
      autosize();
    };
    card.append(meta, rm);
    tray.append(card);
  }
}

/* ---------------------- Dynamic Smart Prompts ---------------------- */
function updateDynamicPrompts(){
  const box = $('#dynPrompts');
  box.replaceChildren();
  const val = $('#input').value.trim().toLowerCase();
  const atts = state.attachments.filter(a => !a.loading);
  const prompts = [];

  if(atts.length){
    const hasData = atts.some(a => /\.(csv|xlsx|tsv|json)$/i.test(a.name));
    const hasCode = atts.some(a => /\.(py|js|ts|html|css|sh|sql)$/i.test(a.name));
    if(hasData){
      prompts.push('Analisis data ini: jalankan agregasi statistik & temukan insight utama');
      prompts.push('Tampilkan distribusi kolom & rekomendasi perbaikan data');
    }
    if(hasCode){
      prompts.push('Review kode: cek potensi bug, performa & celah keamanan');
      prompts.push('Refactor kode ini agar lebih modular dan efisien');
    }
    if(!hasData && !hasCode){
      prompts.push('Ringkas poin-poin krusial dan temuan penting dari dokumen ini');
      prompts.push('Ekstrak daftar tugas dan kesimpulan utama');
    }
  } else if(val.length >= 2){
    if(/(jurnal|paper|riset|penelitian|referensi|sitasi)/.test(val)){
      prompts.push('Cari jurnal ilmiah terpercaya (Semantic Scholar & arXiv) lengkap dengan DOI');
    } else if(/(sql|query|database|tabel|dataset)/.test(val)){
      prompts.push('Tulis query SQL yang optimal dan tampilkan hasil perbandingannya dalam tabel');
    } else if(/(bug|error|exception|debug|fix)/.test(val)){
      prompts.push('Analisis akar masalah (root cause) & sertakan solusi kodenya');
    }
  }

  for(const p of prompts.slice(0, 3)){
    const b = el('button', 'dyn-chip'); b.type = 'button';
    b.append(document.createTextNode(p));
    b.onclick = () => {
      const cur = $('#input').value.trim();
      send(cur ? `${cur}\n\n${p}` : p);
    };
    box.append(b);
  }
}

function closeDialog(){ $('#dialog').classList.remove('show'); $('#dialog').replaceChildren(); }
function openDialog({title, desc, wide = false, body, submit, onSubmit}){
  const g = $('#dialog'); g.replaceChildren();
  const card = el('form', 'card' + (wide ? ' wide' : ''));
  card.append(el('h2', '', title));

  const btns = el('div', 'btns');

    const ok = el('button', 'btn primary', submit);
    ok.type = 'submit'; btns.append(ok);
  }
  card.append(btns);

/* ---------------------- Riwayat Percakapan (Chats) ---------------------- */
function newChat(projectId = null){
  if(busy) return;
  const cur = active();
  if(cur && !cur.messages.length && (cur.projectId || null) === projectId){
    $('#input').focus(); closeSide(); return;
  }
  const model = $('#modelPicker').value || state.config.models[0]?.key;
  const c = {id: uid(), title: 'Percakapan baru', model, messages: [], pinned: false, projectId, updated: Date.now()};
  state.chats.unshift(c); state.activeId = c.id;
  state.datasets = [];
  if(projectId && project(projectId)) project(projectId).open = true;
  save(); renderAll(); closeSide(); $('#input').focus();
}

function deleteChat(id){
  state.chats = state.chats.filter(c => c.id !== id);
  if(state.activeId === id) state.activeId = state.chats[0]?.id || null;
  if(!state.activeId) return newChat();
  save(); renderAll();
}

function openContextMenu(anchor, items){
  document.querySelectorAll('.ctx').forEach(x => x.remove());
  const m = el('div', 'ctx');
  for(const it of items){
    if(it === '-'){ m.append(el('hr')); continue; }
    const b = el('button', it.danger ? 'danger' : ''); b.type = 'button';
    if(it.icon) b.append(ico(it.icon, 14));
    b.append(document.createTextNode(it.label));
    b.onclick = e => { e.stopPropagation(); m.remove(); it.onClick(); };
    m.append(b);
  }
  document.body.append(m);
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = (r.bottom + m.offsetHeight + 10 > innerHeight ? Math.max(8, r.top - m.offsetHeight - 4) : r.bottom + 4) + 'px';
  setTimeout(() => document.addEventListener('click', () => m.remove(), {once: true}), 0);
}

/* ---------------------- Render Sidebar ---------------------- */
function renderSidebar(){
  const box = $('#list'); box.replaceChildren();
  const q = state.query.trim().toLowerCase();
  const match = c => !q || c.title.toLowerCase().includes(q);
  const sorted = [...state.chats].sort((a, b) => (b.updated || 0) - (a.updated || 0));

  // 1. Proyek
  if(!q){
    box.append(secHead('Proyek', iconBtn('plus', 'Proyek baru', () => projectDialog(null), 14)));
    if(!state.projects || !state.projects.length){
      box.append(el('div', 'hint-s', 'Belum ada proyek. Klik + untuk membuat.'));
    } else {
      for(const p of state.projects){
        const projChats = sorted.filter(c => c.projectId === p.id);
        const pRow = el('div', 'item');
        pRow.tabIndex = 0;
        const icon = ico('folder', 14);
        pRow.append(icon);
        const nameSpan = el('span', 't', p.name);
        pRow.append(nameSpan);
        if(projChats.length){
          pRow.append(el('span', 'cnt', String(projChats.length)));
        }
        const acts = el('span', 'acts');
        acts.append(iconBtn('plus', 'Obrolan baru di proyek', () => { newChat(p.id); closeSide(); }, 14));
        acts.append(iconBtn('more', 'Opsi proyek', (e, b) => projectMenu(b, p), 14));
        pRow.append(acts);

        pRow.onclick = () => {
          p.open = !p.open;
          save();
          renderSidebar();
        };
        box.append(pRow);

        if(p.open){
          if(projChats.length === 0){
            const emptyHint = el('div', 'hint-s', '(Belum ada obrolan)');
            emptyHint.style.paddingLeft = '24px';
            box.append(emptyHint);
          } else {
            for(const c of projChats){
              const cRow = chatRow(c);
              cRow.classList.add('indent');
              box.append(cRow);
            }
          }
        }
      }
    }
  }

  // 2. Disematkan (hanya obrolan non-proyek jika tidak sedang mencari)
  const pinned = sorted.filter(c => c.pinned && match(c) && (q || !c.projectId));
  if(pinned.length){
    box.append(secHead('Disematkan'));
    pinned.forEach(c => box.append(chatRow(c)));
  }

  // 3. Pengelompokan Tanggal (hanya obrolan non-proyek jika tidak sedang mencari)
  const unfiled = sorted.filter(c => !c.pinned && match(c) && (q || !c.projectId));
  const now = Date.now(), dayMs = 86400000;
  const groups = {
    'Hari ini': unfiled.filter(c => (now - (c.updated || 0)) < dayMs),
    'Kemarin': unfiled.filter(c => (now - (c.updated || 0)) >= dayMs && (now - (c.updated || 0)) < 2 * dayMs),
    '7 Hari Terakhir': unfiled.filter(c => (now - (c.updated || 0)) >= 2 * dayMs && (now - (c.updated || 0)) < 7 * dayMs),
    'Lebih Lama': unfiled.filter(c => (now - (c.updated || 0)) >= 7 * dayMs)
  };

  for(const [label, list] of Object.entries(groups)){
    if(list.length){
      box.append(secHead(label));
      list.forEach(c => box.append(chatRow(c)));
    }
  }
}

function secHead(title, rightEl){
  const d = el('div', 'sec');
  d.append(el('span', '', title));
  if(rightEl) d.append(rightEl);
  return d;
}
function chatRow(c){
  const row = el('div', 'item' + (c.id === state.activeId ? ' active' : ''));
  row.tabIndex = 0;
  if(c.pinned){ const p = ico('pin', 12); p.classList.add('pin-mark'); row.append(p); }
  row.append(el('span', 't', c.title));
  const acts = el('span', 'acts');
  acts.append(iconBtn('more', 'Opsi', (e, b) => chatMenu(b, c), 14));
  row.append(acts);
  row.onclick = () => { if(busy) return; state.activeId = c.id; save(); renderAll(); closeSide(); };
  return row;
}

        const meta = el('div', 'meta');
        meta.append(el('span', 'name', f.name), el('span', 'sub', formatBytes(f.size || 0)));
        card.append(meta);
        fbox.append(card);
      }
      wrap.append(fbox);
    }
    const uBody = el('div', 'body');
    const uText = m.displayContent || m.content || '';
    uBody.innerHTML = renderMarkdown(uText);
    enhance(uBody, false);
    wrap.append(uBody);
    row.append(wrap);
    return row;
  }

  const main = el('div', 'bot-main');
  const body = el('div', 'body');

  // Live status line
  if(opts.live && opts.statusLine){
    const sLine = el('div', 'live-status');
    sLine.append(el('span', 'live-pulse'), document.createTextNode(opts.statusLine));
    main.append(sLine);
  }

  // Collapsible Reasoning Block
  if(m.reasoning){
    const rBox = el('details', 'reasoning-box');
    const s = el('summary');
    s.append(ico('code', 13), document.createTextNode('Proses Berpikir & Pertimbangan'));
    const rCont = el('div', 'r-content', m.reasoning);
    rBox.append(s, rCont);
    main.append(rBox);
  }

  // Tools yang dijalankan
  for(const t of m.tools || []){
    const d = el('details', 'tool ' + t.status); d.open = !!t.open;
    const lbl = t.status === 'running' ? 'menjalankan… ' + fmtMs(Date.now() - (t.t0 || Date.now()))
              : t.status === 'fail' ? 'gagal' : t.status === 'wait' ? 'menunggu persetujuan' : 'selesai';
    const s = el('summary');
    s.append(el('span', 'dot'), el('span', 'name', t.name),
             el('span', '', lbl + (t.ms != null && t.status !== 'running' ? ' · ' + fmtMs(t.ms) : '')));
    d.append(s, el('pre', '', 'argumen: ' + JSON.stringify(t.args, null, 2) + (t.result ? '\n\nhasil: ' + t.result : '')));
    main.append(d);
  }

  // Kartu Persetujuan (Approval)
  for(const a of m.approvals || []) main.append(approvalCard(a, !!opts.live));

  if(m.content){
    const c = el('div');
    c.innerHTML = renderMarkdown(m.content);
    enhance(c, !!opts.live);
    body.append(c);
  }

  if(m.error) body.append(el('div', 'err', m.error));
  main.append(body);

  if(!opts.live && m.content){
    const a = el('div', 'acts-row');
    const cp = el('button'); cp.type = 'button'; cp.append(ico('copy', 13), document.createTextNode('Salin'));
    cp.onclick = () => copyText(m.content, cp);
    a.append(cp);

    if(m.metaMs){
      const dur = el('span', 'meta-dur', `${fmtMs(m.metaMs)}`);
      a.append(dur);
    }
    main.append(a);
  }

  const av = el('img', 'bot-avatar'); av.src = '/bird.png'; av.alt = '';
  row.append(av, main);
  return row;
}

function approvalCard(a, live){
  const box = el('div', 'appr ' + a.status), h = el('div', 'appr-h');
  h.append(el('span', 'tag', a.group || 'Aksi'), el('b', '', a.name), el('span', 'spacer'), el('span', '', a.status));
  box.append(h);
  const kv = el('div', 'appr-kv');
  for(const [k, v] of Object.entries(a.args || {})) kv.append(el('span', '', k), el('span', '', typeof v === 'string' ? v : JSON.stringify(v)));
  box.append(kv);
  if(a.status === 'pending'){
    const row = el('div', 'appr-b'), no = el('button', 'btn', 'Tolak'), ok = el('button', 'btn primary', 'Setujui');
    no.type = ok.type = 'button'; no.disabled = ok.disabled = !!(live || busy);
    no.onclick = () => decide(a, false); ok.onclick = () => decide(a, true);
    row.append(no, ok); box.append(row);
  }
  return box;
}

async function decide(a, ok){
  const c = active(); if(!c || a.status !== 'pending' || busy) return;
  if(!ok){
    a.status = 'rejected';
    c.messages.push({role: 'user', hidden: true, content: `[Sistem] Pengguna MENOLAK aksi ${a.name}.`});
    save(); renderAll(); return;
  }
  a.status = 'running'; renderAll();
  try{
    const res = await api('/api/action', {
      method: 'POST',
      body: JSON.stringify({name: a.name, args: a.args, exp: a.exp, token: a.token})
    });
    const j = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
    a.status = j.ok ? 'done' : 'fail';
    a.result = JSON.stringify(j.result);
  }catch(e){ a.status = 'fail'; a.result = e.message; }
  c.messages.push({role: 'user', hidden: true, content: `[Sistem] Pengguna MENYETUJUI aksi ${a.name}. Hasil: ${a.result}`});
  save(); renderAll();
}

function renderMessages(){
  const box = $('#msgs'); box.replaceChildren(); const c = active();
  const vis = c ? c.messages.filter(m => !m.hidden) : [];
  if(!vis.length){ box.append(renderEmpty()); return; }
  vis.forEach(m => box.append(renderMsg(m)));
}

function renderTop(){
  const c = active(), sel = $('#modelPicker');
  if(c && c.model) sel.value = c.model;
  $('#topModelLabel').textContent = sel.options[sel.selectedIndex]?.text || '';

  const pb = $('#projBadge');
  if(pb){
    pb.replaceChildren();
    if(c && c.projectId){
      const p = project(c.projectId);
      if(p){
        const badge = el('span', 'badge', p.name);
        badge.title = 'Proyek: ' + p.name;
        pb.append(badge);
      }
    }
  }
}

function renderAll(){
  renderSidebar(); renderMessages(); renderTop();
  const sc = $('#scroll'); sc.scrollTop = sc.scrollHeight;
}

/* ---------------------- Kirim Pesan & Streaming ---------------------- */
function autosize(){
  const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 220) + 'px';
  $('#send').disabled = !canSend();
}

function canSend(){
  return !busy && (!!$('#input').value.trim() || state.attachments.length > 0);
}

function setBusy(v){
  busy = v; const b = $('#send');
  b.replaceChildren(ico(v ? 'stop' : 'up', v ? 16 : 18));
  b.disabled = !canSend() && !v;
}

let liveStatusText = "";
function scheduleRender(){
  if(raf || !liveMsg) return;
  raf = setTimeout(() => {
    raf = 0;
    if(!liveMsg || !liveEl) return;
    const sc = $('#scroll'), near = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 120;
    const row = renderMsg(liveMsg, {live: true, statusLine: liveStatusText});
    liveEl.replaceWith(row); liveEl = row;
    if(near) sc.scrollTop = sc.scrollHeight;
  }, 70);
}

async function send(overrideText){
  const rawText = (overrideText ?? $('#input').value).trim();
  const readyAtts = state.attachments.filter(a => !a.loading);
  if((!rawText && !readyAtts.length) || busy) return;

  if(!active()) newChat();
  const c = active();

  let combinedText = rawText || 'Analisis berkas terlampir:';
  const textDocs = readyAtts.filter(a => a.textContent);
  if(textDocs.length){
    const docBlocks = textDocs.map(d => `--- FILE: ${d.name} ---\n${d.textContent.slice(0, 50000)}\n--- AKHIR FILE ---`).join('\n\n');
    combinedText = `${docBlocks}\n\n${combinedText}`;
  }

  const images = readyAtts.filter(a => a.kind === 'image' && a.dataUrl).map(a => ({
    media_type: a.mediaType, data_url: a.dataUrl
  }));

  c.messages.push({
    role: 'user',
    content: combinedText,
    displayContent: rawText || 'Mengirim berkas lampiran…',
    files: readyAtts.map(a => ({name: a.name, size: a.size, kind: a.kind})),
    images: images
  });

  if(c.messages.filter(m => !m.hidden).length === 1){
    c.title = (rawText || readyAtts[0]?.name || 'Diskusi Baru').slice(0, 42);
  }
  c.updated = Date.now();
  $('#input').value = '';
  state.attachments = [];
  renderAttachments();
  updateDynamicPrompts();
  autosize();
  save();

  await runAssistant(c);
}

async function runAssistant(c){
  const bot = {role: 'assistant', content: '', tools: [], approvals: [], reasoning: ''};
  c.messages.push(bot);
  setBusy(true); renderSidebar(); renderMessages();
  liveMsg = bot; liveEl = $('#msgs').lastElementChild;
  const sc = $('#scroll'); sc.scrollTop = sc.scrollHeight;

  const history = c.messages.slice(0, -1).filter(m => m.content).map(m => ({
    role: m.role, content: m.content, images: m.images || []
  }));

  const off = new Set(state.settings.disabledTools);
  const enabledTools = state.config.tools.filter(t => !off.has(t.name)).map(t => t.name);

  controller = new AbortController();
  liveStatusText = "Menganalisis permintaan…";

  let instr = state.settings.instructions || '';
  if(c.projectId){
    const p = project(c.projectId);
    if(p && p.prompt){
      instr = instr ? `${instr}\n\n[Instruksi Proyek ${p.name}]:\n${p.prompt}` : `[Instruksi Proyek ${p.name}]:\n${p.prompt}`;
    }
  }

  try{
    const res = await api('/api/chat', {
      method: 'POST',
      signal: controller.signal,
      body: JSON.stringify({
        model: c.model || $('#modelPicker').value,
        messages: history,
        instructions: instr,
        about: state.settings.about,
        style: state.settings.style,
        language: state.settings.language,
        deep: state.deep,
        memory: c.memory || null,
        datasets: state.datasets,
        enabled_tools: enabledTools,
        approval_mode: true
      })
    });

    if(!res.ok){
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || ('HTTP ' + res.status));
    }

    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', finished = false;

    while(!finished){
      const {done, value} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while((i = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if(!line) continue;
        let ev; try{ ev = JSON.parse(line); }catch{ continue; }
        if(ev.type === 'done'){ finished = true; break; }
        handleEvent(bot, c, ev);
      }
      scheduleRender();
    }
  }catch(e){
    if(e.name !== 'AbortError') bot.error = e.message;
  }finally{
    clearTimeout(raf); raf = 0; liveMsg = null; liveEl = null; controller = null;
    setBusy(false); c.updated = Date.now(); save(); renderAll();
  }
}

function handleEvent(bot, c, ev){
  if(ev.type === 'text') bot.content += ev.delta;
  else if(ev.type === 'reasoning') bot.reasoning += ev.delta;
  else if(ev.type === 'status') liveStatusText = ev.detail || 'Memproses…';
  else if(ev.type === 'tool_call'){
    bot.tools.push({id: ev.id, name: ev.name, args: ev.args, status: 'running', t0: Date.now()});
    liveStatusText = `Menjalankan ${ev.name}…`;
  } else if(ev.type === 'tool_result'){
    const t = bot.tools.find(x => x.id === ev.id);
    if(t){
      t.result = ev.result; t.ms = Date.now() - (t.t0 || Date.now());
      t.status = ev.result.includes('menunggu_persetujuan_pengguna') ? 'wait' : /^\{"error"/.test(ev.result) ? 'fail' : 'done';
    }
  } else if(ev.type === 'approval_request'){
    bot.approvals = bot.approvals || [];
    bot.approvals.push({id: ev.id, name: ev.name, group: ev.group, args: ev.args, exp: ev.exp, token: ev.token, status: 'pending'});
  } else if(ev.type === 'memory'){
    c.memory = {summary: ev.summary, covered: (c.memory?.covered || 0) + ev.consumed};
  } else if(ev.type === 'meta'){
    bot.metaMs = ev.ms;
  } else if(ev.type === 'error') bot.error = ev.message;
}

/* ---------------------- Modal Pengaturan Pribadi ---------------------- */
function openPersonalSettings(){
  const s = state.settings;
  const b = el('div', 'settings');

  b.append(el('h3', '', 'Tampilan & Ukuran Font'));
  const segTheme = el('div', 'seg');
  for(const [v, l] of [['auto', 'Otomatis'], ['light', 'Terang'], ['dark', 'Gelap']]){
    const x = el('button', s.theme === v ? 'on' : '', l); x.type = 'button';
    x.onclick = () => { s.theme = v; save(); applyTheme(); segTheme.querySelectorAll('button').forEach(y => y.classList.toggle('on', y === x)); };
    segTheme.append(x);
  }
  b.append(segTheme);

  const segFont = el('div', 'seg');
  for(const [v, l] of [['small', 'Kecil'], ['medium', 'Sedang'], ['large', 'Besar']]){
    const x = el('button', s.fontSize === v ? 'on' : '', l); x.type = 'button';
    x.onclick = () => { s.fontSize = v; save(); applyTheme(); segFont.querySelectorAll('button').forEach(y => y.classList.toggle('on', y === x)); };
    segFont.append(x);
  }
  b.append(el('div', 'row', '')); b.append(segFont);

  b.append(el('h3', '', 'Personalisasi AI'));
  const fStyle = el('label', 'field');
  fStyle.append(el('span', '', 'Gaya Respons'));
  const selStyle = el('select');
  for(const [v, l] of [['seimbang', 'Seimbang (Rekomendasi)'], ['ringkas', 'Ringkas & Padat'], ['detail', 'Detail & Menyeluruh']]){
    const opt = el('option', '', l); opt.value = v; if(s.style === v) opt.selected = true; selStyle.append(opt);
  }
  selStyle.onchange = () => { s.style = selStyle.value; save(); };
  fStyle.append(selStyle); b.append(fStyle);

  const fAbout = el('label', 'field');
  fAbout.append(el('span', '', 'Tentang Saya (Peran / Bidang Kerja)'));
  const taAbout = el('textarea'); taAbout.rows = 2; taAbout.value = s.about || '';
  taAbout.placeholder = 'mis. Saya software engineer backend yang fokus pada data pipeline dan AI agent.';
  taAbout.oninput = () => { s.about = taAbout.value; save(); };
  fAbout.append(taAbout); b.append(fAbout);

  const fInst = el('label', 'field');
  fInst.append(el('span', '', 'Instruksi Kustom'));
  const taInst = el('textarea'); taInst.rows = 3; taInst.value = s.instructions || '';
  taInst.placeholder = 'mis. Berikan contoh kode modular lengkap dengan type hints.';
  taInst.oninput = () => { s.instructions = taInst.value; save(); };
  fInst.append(taInst); b.append(fInst);

  b.append(el('h3', '', 'Format Font Salin Tabel'));
  const fCopy = el('label', 'field');
  fCopy.append(el('span', '', 'Font saat tabel disalin ke Word / Docs'));
  const selCopy = el('select');
  for(const [v, l] of [['auto', 'Otomatis (Font Web -> Aptos -> Times New Roman)'], ['Aptos', 'Aptos'], ['Times New Roman', 'Times New Roman'], ['Calibri', 'Calibri'], ['Arial', 'Arial']]){
    const opt = el('option', '', l); opt.value = v; if(s.copyFont === v) opt.selected = true; selCopy.append(opt);
  }
  selCopy.onchange = () => { s.copyFont = selCopy.value; save(); };
  fCopy.append(selCopy); b.append(fCopy);

  b.append(el('h3', '', 'Manajemen Riwayat'));
  const histRow = el('div', 'btns'); histRow.style.justifyContent = 'flex-start';
  const btnExp = el('button', 'btn', 'Ekspor JSON');
  btnExp.type = 'button';
  btnExp.onclick = () => {
    const a = el('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({chats: state.chats, projects: state.projects}, null, 2)], {type: 'application/json'}));
    a.download = 'er-agent-history.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  const btnClr = el('button', 'btn danger', 'Hapus Semua Riwayat');
  btnClr.type = 'button';
  btnClr.onclick = () => {
    if(confirm('Hapus seluruh riwayat percakapan di browser ini?')){
      state.chats = []; state.activeId = null; newChat(); closeDialog();
    }
  };
  histRow.append(btnExp, btnClr); b.append(histRow);

  openDialog({title: 'Pengaturan Pribadi', wide: true, body: b});
}

/* ---------------------- Auth Gate ---------------------- */
function showGate(msg){
  $('#pwErr').textContent = msg || '';
  $('#gate').classList.add('show');
  $('#pw').focus();
}

async function login(e){
  e.preventDefault();
  const res = await api('/api/login', {
    method: 'POST',
    body: JSON.stringify({password: $('#pw').value})
  });
  if(res.ok){
    $('#gate').classList.remove('show'); $('#pw').value = ''; $('#input').focus();
    if(!sync.on && await pullSync()){ if(!state.activeId) newChat(); else renderAll(); }
  } else {
    const j = await res.json().catch(() => ({}));
    $('#pwErr').textContent = j.error || 'Password salah.';
  }
}

/* ---------------------- Inisialisasi ---------------------- */
async function init(){
  const mobBtn = $('#mobileMenuBtn');
  if(mobBtn){ mobBtn.append(ico('sidebar', 18)); mobBtn.onclick = toggleSidebar; }

  $('#attachBtn').append(ico('paperclip', 17));
  $('#newChat').append(ico('plus', 15), document.createTextNode('Percakapan baru'));
  $('#searchBox').prepend(ico('search', 14));
  $('#openSettings').append(ico('sliders', 15), el('span', '', 'Pengaturan'));
  $('#logout').append(ico('logout', 16));

  $('#railNewChat').append(ico('plus', 16));
  $('#railSearch').append(ico('search', 16));
  $('#railSettings').append(ico('sliders', 16));

  setBusy(false); applyTheme(); applySidebarState();

  try{ state.config = await (await api('/api/config')).json(); }catch{}
  await pullSync();

  // Populasi Model Picker
  const sel = $('#modelPicker');
  sel.replaceChildren();
  for(const m of (state.config.models || [])){
    const o = el('option', '', m.label); o.value = m.key; sel.append(o);
  }
  if(state.config.default_model) sel.value = state.config.default_model;

  if(!state.chats.some(c => c.id === state.activeId)) state.activeId = state.chats[0]?.id || null;
  if(!state.activeId) newChat(); else renderAll();

  // Event Listeners
  sel.onchange = () => {
    const c = active(); if(c){ c.model = sel.value; save(); }
    $('#topModelLabel').textContent = sel.options[sel.selectedIndex]?.text || '';
  };
  $('#newChat').onclick = () => newChat();
  $('#railNewChat').onclick = () => newChat();
  $('#openSettings').onclick = openPersonalSettings;
  $('#railSettings').onclick = openPersonalSettings;

  $('#themeBtn').onclick = () => {
    state.settings.theme = isDark() ? 'light' : 'dark';
    save(); applyTheme();
  };
  $('#collapseSideBtn').onclick = toggleSidebar;
  $('#backdrop').onclick = closeSide;
  $('#railSearch').onclick = () => {
    state.settings.sidebarCollapsed = false; save(); applySidebarState(); $('#search').focus();
  };

  $('#deepToggle').onclick = () => {
    state.deep = !state.deep;
    $('#deepToggle').classList.toggle('active', state.deep);
  };

  $('#search').oninput = e => { state.query = e.target.value; renderSidebar(); };
  $('#send').onclick = () => busy ? controller?.abort() : send();
  $('#input').addEventListener('input', () => { autosize(); updateDynamicPrompts(); });

  const coarse = matchMedia('(pointer: coarse)');
  $('#input').addEventListener('keydown', e => {
    if(e.key !== 'Enter' || e.isComposing) return;
    if(e.ctrlKey || e.metaKey || (!e.shiftKey && !coarse.matches && state.settings.enterToSend)){
      e.preventDefault(); send();
    }
  });

  $('#loginForm').onsubmit = login;
  $('#logout').onclick = async () => { try{ await api('/api/logout', {method: 'POST'}); }catch{} showGate(); };
  $('#attachBtn').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = e => { if(e.target.files.length) handleFiles(e.target.files); e.target.value = ''; };

  // Drag & Drop
  let dragCnt = 0;
  window.addEventListener('dragenter', e => {
    if(e.dataTransfer?.types?.includes('Files')){ dragCnt++; $('#dropzone').classList.add('show'); }
  });
  window.addEventListener('dragleave', () => {
    dragCnt = Math.max(0, dragCnt - 1);
    if(dragCnt === 0) $('#dropzone').classList.remove('show');
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault(); dragCnt = 0; $('#dropzone').classList.remove('show');
    if(e.dataTransfer?.files?.length) handleFiles(e.dataTransfer.files);
  });

  document.addEventListener('keydown', e => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b'){ e.preventDefault(); toggleSidebar(); }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      state.settings.sidebarCollapsed = false; save(); applySidebarState(); $('#search').focus();
    }
  });

  try{
    const s = await (await api('/api/session')).json();
    if(!s.configured) showGate('APP_PASSWORD belum diset di server.');
    else if(!s.ok) showGate();
  }catch{}
  window.__ready = true;
}
init();
